[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "p4report"
version = "1.0.0"
description = "Synthetic Perforce changelist activity reporting demo"
requires-python = ">=3.12"
dependencies = ["openpyxl>=3.1,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-cov>=5,<7", "PyYAML>=6,<7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--cov=p4report --cov-report=term-missing --cov-fail-under=90"

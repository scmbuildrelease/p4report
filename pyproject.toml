[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "p4report"
version = "1.1.0"
description = "Synthetic Perforce changelist activity reporting demo"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["openpyxl>=3.1.5,<4"]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.17,<0.18",
  "mypy>=2.4,<3",
  "types-openpyxl>=3.1.5",
  "PyYAML>=6,<7",
  "setuptools>=77",
]

[project.scripts]
p4report = "p4report.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
p4report = ["py.typed", "data/*.txt", "data/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--cov=p4report --cov-report=term-missing --cov-fail-under=95"

[tool.coverage.run]
branch = true

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "BLE", "S", "DTZ", "RUF"]

[tool.ruff.lint.isort]
known-local-folder = ["conftest"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603", "DTZ001"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

name: Weekly synthetic Perforce report

on:
  schedule:
    - cron: "0 17 * * 1"
  workflow_dispatch:
    inputs:
      send_email:
        description: Send email (requires configured SMTP secrets)
        type: boolean
        required: false
        default: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Generate report
        env:
          SEND_EMAIL: ${{ (github.event_name == 'workflow_dispatch' && inputs.send_email) || (github.event_name == 'schedule' && vars.SEND_EMAIL == 'true') }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          REPORT_RECIPIENT: ${{ vars.REPORT_RECIPIENT || 'aaa@example.com' }}
        run: python -m p4report --send-email
      - name: Upload Excel report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p4report-${{ github.run_id }}
          path: reports/*.xlsx
          if-no-files-found: warn
          retention-days: 30
